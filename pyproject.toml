[project]
name = "agentpg-identity"
version = "0.1.0"
description = "The identity provider of the AgentPG ecosystem: OpenID Connect and OAuth 2.0 (authorization code with PKCE, refresh rotation, client credentials), users, groups, per-app roles, and sign-in with Google or GitHub, on Postgres."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "agentpg-kit>=0.2.4",
  "authlib>=1.7",
  "joserfc>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "cryptography>=43",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
identity = "identity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]

# Local development: use the sibling checkout of the kit. Images install the published kit instead (see Dockerfile).
[tool.uv.sources]
agentpg-kit = { path = "../agentpg-kit", editable = true }
